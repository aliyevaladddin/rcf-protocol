name: Sovereign Release & Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  verify-version:
    name: ✅ Verify Versions Match Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check package versions against release tag
        run: |
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "Manual run — skipping tag/version check."
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          echo "Release tag: $TAG → expected version: $EXPECTED"
          fail=0
          check() {
            local label="$1" file="$2" actual="$3"
            if [ "$actual" = "$EXPECTED" ]; then
              echo "✅ $label ($file): $actual"
            else
              echo "❌ $label ($file): $actual — expected $EXPECTED (from $TAG)"
              fail=1
            fi
          }
          ROOT=$(node -p "require('./package.json').version")
          check "Root" "package.json" "$ROOT"
          TS=$(node -p "require('./sdk/typescript/package.json').version")
          check "TypeScript SDK" "sdk/typescript/package.json" "$TS"
          PY=$(grep -m1 '^version' sdk/python/pyproject.toml | sed 's/version *= *"\(.*\)"/\1/')
          check "Python SDK" "sdk/python/pyproject.toml" "$PY"
          RS=$(grep -m1 '^version' sdk/rust/Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          check "Rust SDK" "sdk/rust/Cargo.toml" "$RS"
          if [ "$fail" -ne 0 ]; then
            echo "::error::Version mismatch with release tag $TAG. Bump all manifests before publishing."
          fi
          exit $fail

  publish-pypi:
    name: 🚀 Publish PyPI & Attest
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Copy sigma.json for packaging
        run: |
          mkdir -p sdk/python/rcf_core/data
          cp SPECIFICATION/sigma.json sdk/python/rcf_core/data/sigma.json
      - name: Build
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'sdk/python/dist/*'
      - name: Publish to PyPI
        working-directory: sdk/python
        run: python -m twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: sdk/python/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: 🚀 Publish NPM & Attest
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Copy sigma.json for packaging
        run: |
          mkdir -p sdk/typescript/SPECIFICATION
          cp SPECIFICATION/sigma.json sdk/typescript/SPECIFICATION/sigma.json
      - name: Install & Publish
        working-directory: sdk/typescript
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "ERROR: NPM_API_TOKEN is empty! Check your GitHub Secrets."
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          npm ci
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}

  publish-crates:
    name: 🚀 Publish Crates.io
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        working-directory: sdk/rust
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

